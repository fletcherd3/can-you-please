$kind: http-request
url: https://cards-api.internal.{{e_short_env}}.au.edge.zip.co/cards
method: POST
headers:
  x-zip-device-token: VTpjn3YPnsXcK7eI8Cjw
  Customer-Id: "{{var_customer_id}}"
  x-zip-yi-customer-session-id: bio123
  x-zip-requestid: ""
body:
  type: json
  content: |-
    {
      "requestId": "{{$randomUUID}}",
      "cardType": "MULTI_USE",
      "merchantURL": "https://www.jbhifi.com.au/",
      "account": {
        "id": "{{var_account_id}}",
        "consumerIds": [{{var_consumer_id}}],
        "type": {
          "name": "Zip",
          "product": "{{var_product}}",
          "referenceCode": "ZIP"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function () {
          pm.response.to.have.status(201);
      });

      const response = pm.response.json()
      pm.variables.set('var_card_id', response.card.id)
      pm.variables.set('var_external_id', response.card.externalId)

      console.log('card details:')
      console.log(`cardId: ${pm.variables.get('var_card_id')}`)
      console.log(`externalId: ${pm.variables.get('var_external_id')}`)
    language: text/javascript
  - type: beforeRequest
    code: |-
      let tmp;

      switch (pm.globals.get('product')) {
          case 'zip-pay':
              tmp = 'Zip Pay';
              break;
          case 'zip-plus':
              tmp = 'Zip Plus';
              break;
          case 'zip-money':
              tmp = 'Zip Money';
              break;
          default:
              tmp = 'Zip Pay';
              break;
      }

      pm.variables.set('var_product', tmp)
    language: text/javascript
order: 3000
