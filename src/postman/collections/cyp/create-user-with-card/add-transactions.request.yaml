scripts:
  - type: beforeRequest
    code: >-
      var uuid = require('uuid');

      pm.variables.set("var_auth_token_1", uuid.v4());

      pm.variables.set("var_auth_token_2", uuid.v4());

      pm.variables.set("var_auth_token_3", uuid.v4());

      pm.variables.set("var_auth_token_4", uuid.v4());

      pm.variables.set("var_auth_token_5", uuid.v4());



      function randomXDigitNumber(x) {
          if (!Number.isInteger(x) || x < 1) throw new TypeError('x must be a positive integer');
          if (x === 1) return Math.floor(Math.random() * 9) + 0; // 0..9 (if you want 1..9 use +1)
          const min = 10 ** (x - 1);
          const range = 9 * (10 ** (x - 1)); // from min to min+range-1 = 10^x - 1
          return Math.floor(Math.random() * range) + min;
      }

      // id_1 in jit funding request

      pm.variables.set("var_network_ref_id_2", randomXDigitNumber(15));

      pm.variables.set("var_network_ref_id_3", randomXDigitNumber(15));

      pm.variables.set("var_network_ref_id_4", randomXDigitNumber(15));

      pm.variables.set("var_network_ref_id_5", randomXDigitNumber(15));
    language: text/javascript
order: 5000
